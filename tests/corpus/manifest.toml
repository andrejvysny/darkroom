# sRAW1: Canon's YCbCr half-size 'raw' — three components per pixel, no CFA. Exercises the non-Bayer branch.
#
# History: first recorded as XFAIL (2026-09-08) — the embedded preview is the FULL sensor readout
# (5616x3744) while the sRAW planes develop to 3861x2574, and rawler's dummy (geometry-only) decode
# asserts on cpp=3, so `thumbnail_jpeg` fell back to the preview's dims. Fixed the same day:
# `thumb.rs` now pays for one real decode when the dummy one fails, so the catalog stores the
# developed 3861x2574. The contained panic on the dummy path is expected and logged at warn.
[[file]]
id = "canon-5d2-sraw1"
path = "Canon/EOS 5D Mark II/09.canon.sraw1.cr2"
sha256 = "acadf73d760b1f311f18f473b859e262ef3ba1513b3360f02675c38dcadba80b"
bytes = 15445115
make = "Canon"
model = "EOS 5D Mark II"
tier = 1
tags = ["cr2", "sraw"]
support = "ok"
deep = false
xfail = []

