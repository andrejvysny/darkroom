# Multi-maker RAW test corpus — IDENTITY AND ACQUISITION ONLY.
#
# Every sample here comes from the raw.pixls.us CC0 pool (https://raw.pixls.us/), which only
# accepts files their contributors released under CC0. Nothing is redistributed by this repo: the
# manifest records *where* each file lives and *what bytes* it must hash to, and
# `scripts/fetch_raw_corpus.sh` downloads it into `target/raw-corpus/` (git-ignored).
#
# This file is the CI cache key (`hashFiles('tests/corpus/manifest.toml')`), so it must change only
# when the *set of files* changes — never when a golden moves. Measured values live in
# `expected.toml`; the only judgement calls stored here are `support` (does this build decode it at
# all) and `xfail` (which assertions are known-red today).
#
# FORMAT IS LOAD-BEARING: `scripts/fetch_raw_corpus.sh` parses this with awk, one `key = value` per
# line, so every `[[file]]` key must stay on a single line. `corpus.rs::manifest_shape_is_parsable`
# enforces that (and the 800 MB total budget) on every test run.
#
# Directory casing upstream is inconsistent (`Sony/ILCE-7M3` but `SONY/ILCE-6400A`); `path` is the
# exact upstream string and must not be normalised.
#
# Tier 1 (~367 MB) is what CI fetches on every run. Tier 2 (~311 MB more) is the extended set:
# `scripts/fetch_raw_corpus.sh --tier 2` + `DARKROOM_CORPUS_TIER=2`.

source_base = "https://raw.pixls.us/download/data"
filelist = "https://raw.pixls.us/data/filelist.sha256"
# Dataset stamp (https://raw.pixls.us/data/timestamp.txt) at the time these hashes were recorded.
upstream_timestamp = 1788897901

