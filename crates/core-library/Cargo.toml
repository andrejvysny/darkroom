[package]
name = "core-library"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
core-db = { path = "../core-db" }
core-raw = { path = "../core-raw" }
# Pick/reject preference model (pure math). The catalog seam lives in `suggest.rs`.
core-suggest = { path = "../core-suggest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
walkdir = "2"
trash = "5"

[dev-dependencies]
# Only for the `detect_catalog` example: the headless mirror of the app's panorama-detection job,
# which needs the detector (core-pano) and a thumb decoder (image). Not linked by the library.
core-pano = { path = "../core-pano" }
image = "0.25"
