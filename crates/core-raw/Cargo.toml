[package]
name = "core-raw"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rawler = "=0.7.2"
image = "0.25"
kamadak-exif = "0.6"
blake3 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Merged-HDR storage (fp16 linear-ProPhoto OpenEXR). Same version image 0.25 already pulls in
# transitively, so this adds no new build cost.
exr = "1.74"

# HEIF (.hif) decode. Pinned exact (C-API surface); `v1_17` matches the oldest system libheif we
# support (Ubuntu noble's 1.17); Homebrew's newer libheif is backward-compatible with that subset.
# Not built on Windows (no system libheif there yet) — `heif.rs` compiles a stub instead.
[target.'cfg(not(windows))'.dependencies]
libheif-rs = { version = "=2.7.0", default-features = false, features = ["v1_17"] }

[dev-dependencies]
anyhow = "1"
core-pano = { path = "../core-pano" }
