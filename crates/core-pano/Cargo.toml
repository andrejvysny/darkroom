[package]
name = "core-pano"
edition.workspace = true
version.workspace = true
license.workspace = true

# Panorama registration core (P1): features -> matching -> RANSAC -> match graph ->
# camera model -> bundle adjustment -> wave correction. Pure Rust, NO rawler: this crate
# consumes plain f32 RGB buffers (`Frame`) produced upstream by `core_raw::develop_camera_native`,
# so it never links the RAW decoder and stays trivially unit-testable. P2 (warp/blend compositing)
# will consume the `Registration` this crate returns.
[dependencies]
nalgebra = "0.33"
imageproc = "0.25"
image = "0.25"
rayon = "1"
thiserror = "2"
pathfinding = "4.15.0"

[dev-dependencies]
# Seeded StdRng only, for generating deterministic synthetic test fixtures (outliers / textures).
# The library itself uses no rand — its randomness is a self-contained SplitMix64 (see rng.rs) so
# feature/RANSAC determinism can never drift with a transitive rand bump.
rand = "0.8"
anyhow = "1"
# Integration tests construct/inspect the `Matrix3` rotations the public API returns.
nalgebra = "0.33"
