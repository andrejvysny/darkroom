[package]
name = "core-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Exposes the catalog fixture (`sidecar::test_support::Fix`) to host test suites; off by default.
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
core-app = { path = "../core-app" }
core-model = { path = "../core-model" }
core-db = { path = "../core-db" }
core-library = { path = "../core-library" }
core-import = { path = "../core-import" }
core-preset = { path = "../core-preset" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"
image = "0.25"
# `tests/catalog.rs` builds a schema-25 catalog with the same pinned migration engine `Db::open`
# uses (mirrors `core-db`'s dev-dependency), to pin the pre-upgrade backup on the open path.
rusqlite_migration = "=2.5.0"
