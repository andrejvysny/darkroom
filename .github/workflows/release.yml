name: release
on:
  push:
    tags: ["v*", "beta-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v0.1.1 or beta-1.1"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              platform: macos-15,
              rustTargets: "aarch64-apple-darwin",
              args: "--target aarch64-apple-darwin --bundles dmg",
            }
          - {
              platform: macos-15-intel,
              rustTargets: "x86_64-apple-darwin",
              args: "--target x86_64-apple-darwin --bundles dmg",
            }
          - {
              platform: windows-latest,
              rustTargets: "",
              args: "--bundles nsis",
            }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");

          const tag = process.env.RELEASE_TAG ?? "";
          const versionTag = tag.match(/^v(\d+\.\d+\.\d+)$/);
          const betaTag = tag.match(/^beta-(\d+)\.(\d+)$/);

          if (!versionTag && !betaTag) {
            console.error(`Release tag must match vX.Y.Z or beta-X.Y, got "${tag}".`);
            process.exit(1);
          }

          function readJsonVersion(path) {
            return JSON.parse(fs.readFileSync(path, "utf8")).version;
          }

          function readTomlVersion(path, section) {
            const lines = fs.readFileSync(path, "utf8").split(/\r?\n/);
            let active = false;

            for (const line of lines) {
              const header = line.match(/^\s*\[([^\]]+)\]\s*$/);
              if (header) {
                active = header[1] === section;
                continue;
              }

              if (!active) {
                continue;
              }

              const version = line.match(/^\s*version\s*=\s*"([^"]+)"/);
              if (version) {
                return version[1];
              }
            }

            throw new Error(`Missing version in [${section}] of ${path}`);
          }

          // Pre-1.0 beta scheme: a `beta-X.Y` tag maps to app version `0.X.Y`, so beta releases
          // ride the project's 0.x patch line (e.g. beta-1.1 -> 0.1.1) rather than forcing a major.
          const expected = versionTag ? versionTag[1] : `0.${betaTag[1]}.${betaTag[2]}`;
          const versions = {
            "package.json": readJsonVersion("package.json"),
            "src-tauri/tauri.conf.json": readJsonVersion("src-tauri/tauri.conf.json"),
            "Cargo.toml [workspace.package]": readTomlVersion("Cargo.toml", "workspace.package"),
            "src-tauri/Cargo.toml [package]": readTomlVersion("src-tauri/Cargo.toml", "package"),
          };

          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected);
          if (mismatches.length > 0) {
            console.error(`Release tag ${tag} requires version ${expected}.`);
            for (const [source, version] of mismatches) {
              console.error(`${source}: ${version}`);
            }
            process.exit(1);
          }
          NODE

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install frontend deps
        run: npm ci

      # Code-signing is ENV-GATED: it only activates when the corresponding GitHub Actions secrets are
      # set. With no secrets (the default today) the macOS DMG stays ad-hoc signed and Windows stays
      # unsigned — the build still succeeds. To ship signed installers later, add these repo secrets:
      #   macOS Developer ID + notarization: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      #     APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"), APPLE_ID,
      #     APPLE_PASSWORD (app-specific), APPLE_TEAM_ID, KEYCHAIN_PASSWORD (any random string).
      #   Windows Authenticode: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD.
      # When APPLE_SIGNING_IDENTITY is present this step flips tauri.conf.json off ad-hoc ("-") to the
      # real identity + hardened runtime + entitlements so tauri-action notarizes; otherwise it is a no-op.
      - name: Enable macOS signing (only when secrets present)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const p = "src-tauri/tauri.conf.json";
          const c = JSON.parse(fs.readFileSync(p, "utf8"));
          c.bundle = c.bundle || {};
          c.bundle.macOS = c.bundle.macOS || {};
          c.bundle.macOS.signingIdentity = process.env.APPLE_SIGNING_IDENTITY;
          c.bundle.macOS.hardenedRuntime = true;
          c.bundle.macOS.entitlements = "Darkroom.entitlements";
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          console.log("Enabled Developer ID signing + hardened runtime for", process.env.APPLE_SIGNING_IDENTITY);
          NODE

      # tauri-action runs beforeBuildCommand (npm run build), bundles, and uploads to the release.
      # Pinned from tauri-apps/tauri-action v0.6.2.
      # NOTE: We only pass signing secrets if configured; otherwise tauri-action tries to import empty
      # certs and fails. tauri.conf.json has signingIdentity="-" for ad-hoc signing as fallback.
      - name: Build app + create release (with signing)
        if: secrets.APPLE_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE != ''
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tauriScript: npm run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Darkroom ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Release artifacts:
            - macOS Apple Silicon and Intel DMGs are ad-hoc signed (signed with real cert if APPLE_CERTIFICATE secret configured).
            - Intel macOS build ships with AI analysis disabled because ONNX Runtime has no x86_64 macOS prebuilt for the pinned ort runtime.
            - Windows x64 NSIS installer is unsigned (signed if WINDOWS_CERTIFICATE secret configured).
          releaseDraft: ${{ !startsWith(env.RELEASE_TAG, 'beta-') }}
          prerelease: true

      - name: Build app + create release (ad-hoc signed)
        if: secrets.APPLE_CERTIFICATE == '' || secrets.WINDOWS_CERTIFICATE == ''
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tauriScript: npm run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Darkroom ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Release artifacts:
            - macOS Apple Silicon and Intel DMGs are ad-hoc signed and not notarized unless Developer ID signing secrets are configured.
            - Intel macOS build ships with AI analysis disabled because ONNX Runtime has no x86_64 macOS prebuilt for the pinned ort runtime.
            - Windows x64 NSIS installer is unsigned unless an Authenticode certificate is configured.
          # Publish beta-* tags directly as pre-releases; keep stable v* tags as drafts for review.
          releaseDraft: ${{ !startsWith(env.RELEASE_TAG, 'beta-') }}
          prerelease: true
