name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly so a raw.pixls.us change (a re-uploaded sample, a moved path) is caught on its own
  # schedule rather than in someone's PR.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # macOS so the wgpu/Metal develop pipeline + the committed CR3 fixture run for real (the GPU and
    # decode tests are no-ops on a GPU-less / fixture-less host). Linux would need webkit2gtk for the
    # Tauri crate and has no Metal, so it can't exercise the develop pipeline.
    runs-on: macos-latest
    env:
      # Turn a missing committed fixture into a hard failure instead of a silently-skipped test.
      DARKROOM_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4

      # HEIF decode (core-raw/src/heif.rs) dynamic-links system libheif — the runner image
      # usually ships it, but pin the install so the build never depends on image luck.
      - name: Install libheif (HEIF decode system dep)
        run: brew install libheif

      # tauri-build validates the bundle.macOS.frameworks paths (tauri.macos.conf.json) at
      # compile time, so the dylib closure must be staged before any cargo build of src-tauri.
      - name: Stage macOS dylib closure
        run: bash scripts/macos-bundle-dylibs.sh stage

      - name: Install Rust 1.91 (+ clippy)
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Frontend type-check + build
        run: npm run build

      # `core-raw` contains rawler's decoder panics with `catch_unwind` so one odd RAW is skipped
      # instead of aborting the app. `panic = "abort"` in the release profile would silently turn
      # every such file into a crash, and nothing else would notice.
      - name: Release profile must unwind (decoder panic isolation)
        run: grep -q 'panic = "abort"' Cargo.toml && exit 1 || true

      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --examples -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # Compile-only gate so PRs catch Windows breakage (cross-platform cfg, ort/DirectML linking,
  # MSVC-built C deps). GPU/CR3 behaviour is validated by the macOS job + manual run-through; the
  # headless windows-latest runner can't exercise the real DX12 path, so no tests run here.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91 (+ clippy)
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Frontend type-check + build
        run: npm run build

      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release

  # Multi-maker RAW decode regression (tests/corpus/). ~370 MB of CC0 samples from raw.pixls.us,
  # cached on the manifest hash so a normal run downloads nothing. Ubuntu because this job needs no
  # GPU and no Metal: it is pure CPU decode + colour math, and Linux runners are cheaper and larger.
  #
  # Not on every PR — it is the slowest job and the download is a third-party dependency. It runs on
  # main, nightly, on demand, and on any PR carrying the `raw-corpus` label. `pull_request` keeps its
  # default event types (adding `labeled` would re-run the whole workflow, and cancel the in-flight
  # run, every time any label is touched), so labelling an OPEN pr takes effect on its next push —
  # or use "Run workflow" on the Actions tab.
  raw-corpus:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'raw-corpus')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # core-raw dynamic-links system libheif (HEIF decode); the corpus itself is RAW-only, but the
      # crate does not build without it.
      - name: Install libheif (HEIF decode system dep)
        run: sudo apt-get update && sudo apt-get install -y libheif-dev libde265-dev

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Keyed on the manifest: the corpus only changes when the SET of files changes, so goldens can
      # move freely without paying for a re-download.
      - name: Cache RAW corpus
        uses: actions/cache@v4
        with:
          path: target/raw-corpus
          key: raw-corpus-v1-${{ hashFiles('tests/corpus/manifest.toml') }}
          restore-keys: raw-corpus-v1-

      - name: Fetch RAW corpus (tier 1)
        run: bash scripts/fetch_raw_corpus.sh --tier 1

      # DARKROOM_REQUIRE_CORPUS=1 turns a missing/incomplete corpus into a failure instead of a
      # silently-skipped test — the same contract DARKROOM_REQUIRE_FIXTURES has in the macOS job.
      - name: Corpus tests
        run: DARKROOM_REQUIRE_CORPUS=1 cargo test -p core-raw -p core-library --test corpus --test corpus_index -- --nocapture
