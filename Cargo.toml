[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/core-raw",
    "crates/core-db",
    "crates/core-library",
    "crates/core-pipeline",
    "crates/core-dedup",
    "crates/core-import",
    "crates/core-analyze",
    "crates/core-preset",
    "crates/core-hdr",
    "crates/core-pano",
    "crates/core-suggest",
]

[workspace.package]
edition = "2021"
version = "0.1.2"
license = "MIT"
authors = ["Andrej Vysny"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
# Unwind (the default) is load-bearing: `core-raw` contains decoder panics from the rawler crate
# with `catch_unwind` so one corrupt/odd RAW skips that file instead of aborting the whole app.
# Do NOT set `panic = "abort"` here — `core-raw` fails to compile if you do.

# Faster RAW decode / image work even in dev
[profile.dev.package."*"]
opt-level = 2
# `package."*"` covers dependencies only; the decode hot loops live in our own crate. Without this,
# `cargo test` develops a 32 MP RAW at opt-level 0 (10-20x slower corpus tests).
[profile.dev.package.core-raw]
opt-level = 3
